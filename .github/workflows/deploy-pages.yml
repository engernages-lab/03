name: Deploy frontend to GitHub Pages

# Publishes the static SPA to https://<owner>.github.io/<repo>/
# The Pages site is enabled automatically on the first run (configure-pages
# enablement), so no manual repository setting is required.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build for Pages
        working-directory: frontend
        env:
          # Repository name is the sub-path: /03/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Point the deployed SPA at a public API when one exists; empty means
          # same-origin (/api), which only works for the single-container deploy.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      # GitHub Pages has no SPA rewrite: serve index.html for unknown deep links.
      - name: Add SPA fallback (404.html)
        working-directory: frontend
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll processing
        working-directory: frontend
        run: touch dist/.nojekyll

      - name: Configure Pages (enables the site on first run)
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site with "GitHub Actions" as the source when the
          # repository does not have Pages enabled yet.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
