name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend · pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt pins ruff so CI matches the local toolchain.
          pip install -r requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: python -m ruff check app tests
      - name: Test
        working-directory: backend
        run: |
          set +e
          python -m pytest -q --tb=short > pytest.log 2>&1
          code=$?
          tail -n 40 pytest.log
          if [ $code -ne 0 ]; then
            # Surface a compact failure summary as a check annotation so the
            # failure is readable without downloading the full log.
            summary=$(grep -E "^(FAILED|ERROR)" pytest.log | head -n 6 | tr '\n' ';' | cut -c1-900)
            echo "::error title=pytest failures::${summary}"
          fi
          exit $code

  frontend:
    name: Frontend · typecheck + vitest + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install E2E tooling
        # Root package.json holds @playwright/test; playwright.config.ts resolves
        # the Python interpreter (venv on Windows, python3 in CI).
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Generate fixtures
        run: python scripts/make_fixtures.py
      - name: Run E2E
        run: |
          set +e
          npx playwright test tests/e2e/workstation.spec.ts --reporter=list > e2e.log 2>&1
          code=$?
          tail -n 60 e2e.log
          if [ $code -ne 0 ]; then
            summary=$(grep -E "(✘|Error:|expect\(|Timed out|waiting for)" e2e.log | head -n 8 | tr '\n' ';' | cut -c1-900)
            echo "::error title=E2E failures::${summary}"
          fi
          exit $code
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/report
            test-results
          retention-days: 7
