name: Docker verify (V1.1-C.2.1)

# Real Linux container gate: build the image, boot it with a Railway-style
# $PORT, run an actual Basic Pitch transcription, rebuild the container on the
# same volume and check the data survived, then verify SIGTERM shutdown.
#
# Manual dispatch is the primary entry point: the workflow is intentionally
# conservative about spending CI minutes on full AI image builds.

on:
  workflow_dispatch:
  pull_request:
    branches: [main, "pocketscore-v1.1-*"]
    paths:
      - "backend/**"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/vite.config.ts"
      - "tests/fixtures/**"
      - "scripts/docker/**"
      - "scripts/deploy/**"
      - ".github/workflows/docker-verify.yml"
      - "railway.json"
  push:
    branches: ["pocketscore-v1.1-b", main]
    paths:
      - "backend/**"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/vite.config.ts"
      - "tests/fixtures/**"
      - "scripts/docker/**"
      - "scripts/deploy/**"
      - ".github/workflows/docker-verify.yml"
      - "railway.json"

permissions:
  contents: read

concurrency:
  group: docker-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  OUT_DIR: docker-verification
  IMAGE: pocketscore-ai:c2-verify

jobs:
  docker-verify:
    name: docker-verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------- shell
      - name: Syntax-check verification scripts
        run: |
          set -euo pipefail
          for script in scripts/docker/*.sh scripts/deploy/*.sh; do
            bash -n "$script"
            echo "syntax ok: $script"
          done
          python3 -m py_compile scripts/docker/verify-transcription.py scripts/docker/verify-context.py
          echo "syntax ok: python tools"

      # --------------------------------------------------------------- secrets
      - name: Generate throwaway test secrets
        run: |
          set -euo pipefail
          SESSION=$(openssl rand -base64 48 | tr -d '\n')
          GATE=$(openssl rand -hex 24)
          FERNET=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '\n')
          echo "::add-mask::$SESSION"
          echo "::add-mask::$GATE"
          echo "::add-mask::$FERNET"
          echo "TEST_SESSION_SECRET=$SESSION" >> "$GITHUB_ENV"
          echo "TEST_ACCESS_TOKEN=$GATE" >> "$GITHUB_ENV"
          echo "TEST_TOKEN_KEY=$FERNET" >> "$GITHUB_ENV"
          echo "RUN_ID=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "VOLUME=pocketscore-c21-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Secret scan (pre-build)
        run: bash scripts/docker/scan-secrets.sh

      # --------------------------------------------------------------- frontend
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (lockfile)
        working-directory: frontend
        run: npm ci

      - name: Production build
        working-directory: frontend
        env:
          VITE_BASE_PATH: /03/
        run: npm run build

      - name: Verify frontend artefacts (required by the image COPY)
        run: |
          set -euo pipefail
          test -f frontend/dist/index.html
          test -d frontend/dist/assets
          # the Dockerfile copies frontend/dist, so a missing bundle must fail here
          map_count=$(find frontend/dist -name '*.map' | wc -l)
          echo "sourcemaps in dist: $map_count"
          test "$map_count" -eq 0
          du -sh frontend/dist

      # A missing COPY source (or one hidden by .dockerignore) otherwise fails
      # deep inside BuildKit with a log that needs repo admin rights to read.
      - name: Verify build context (Dockerfile COPY vs .dockerignore)
        run: python3 scripts/docker/verify-context.py --dockerfile backend/Dockerfile

      # ----------------------------------------------------------------- docker
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=pocketscore-docker
          cache-to: type=gha,mode=max,scope=pocketscore-docker
          build-args: |
            BUILD_REVISION=${{ github.sha }}

      - name: Verify image contents (deps, model, ffmpeg, dist)
        run: bash scripts/docker/verify-image.sh "$IMAGE"

      - name: Image security scan
        run: bash scripts/docker/scan-secrets.sh "$IMAGE"

      # --------------------------------------------------------------- run: PORT
      - name: Create test volume
        run: docker volume create "$VOLUME"

      - name: PORT injection - non-default port 8123
        run: |
          set -euo pipefail
          name="pocketscore-c21-${RUN_ID}-port"
          docker run -d --name "$name" -p 127.0.0.1:8123:8123 \
            -e PORT=8123 \
            -e POCKETSCORE_ENVIRONMENT=staging \
            -e POCKETSCORE_LOG_JSON=true \
            -e "POCKETSCORE_SESSION_SECRET=${TEST_SESSION_SECRET}" \
            -e "POCKETSCORE_TOKEN_ENCRYPTION_KEY=${TEST_TOKEN_KEY}" \
            -e POCKETSCORE_CORS_ORIGINS=http://127.0.0.1:8123 \
            -e POCKETSCORE_ALLOW_PRIVATE_NETWORK_SOURCES=false \
            -e "POCKETSCORE_ACCESS_GATE_TOKEN=${TEST_ACCESS_TOKEN}" \
            -e POCKETSCORE_DATABASE_URL=sqlite:////data/pocketscore.db \
            -e POCKETSCORE_STORAGE_DIR=/data/storage \
            -e POCKETSCORE_MODEL_PRELOAD=true \
            -v "${VOLUME}:/data" \
            "$IMAGE"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8123/health >/dev/null; then
              echo "PORT=8123 honoured after ${i} polls"
              docker port "$name"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8123/health > /dev/null || (docker logs "$name"; exit 1)
          # the container must NOT be listening on 8000
          if docker exec "$name" sh -c 'python -c "import socket,sys; s=socket.socket(); sys.exit(0 if s.connect_ex((\"127.0.0.1\",8000))==0 else 1)"'; then
            echo "::error::service also listening on 8000 - PORT was ignored"
            exit 1
          fi
          docker stop --time 30 "$name" >/dev/null
          docker rm "$name" >/dev/null

      - name: Start container on the default port with the volume
        run: |
          set -euo pipefail
          name="pocketscore-c21-${RUN_ID}-main"
          docker run -d --name "$name" -p 127.0.0.1:8000:8000 \
            -e PORT=8000 \
            -e POCKETSCORE_ENVIRONMENT=staging \
            -e POCKETSCORE_DEBUG=false \
            -e POCKETSCORE_LOG_JSON=true \
            -e "POCKETSCORE_SESSION_SECRET=${TEST_SESSION_SECRET}" \
            -e "POCKETSCORE_TOKEN_ENCRYPTION_KEY=${TEST_TOKEN_KEY}" \
            -e POCKETSCORE_CORS_ORIGINS=http://127.0.0.1:8000 \
            -e POCKETSCORE_ALLOW_PRIVATE_NETWORK_SOURCES=false \
            -e "POCKETSCORE_ACCESS_GATE_TOKEN=${TEST_ACCESS_TOKEN}" \
            -e POCKETSCORE_DATABASE_URL=sqlite:////data/pocketscore.db \
            -e POCKETSCORE_STORAGE_DIR=/data/storage \
            -e POCKETSCORE_MODEL_PRELOAD=true \
            -e POCKETSCORE_MAX_UPLOAD_MB=50 \
            -e POCKETSCORE_MAX_CONCURRENT_INFERENCES=1 \
            -e POCKETSCORE_INFERENCE_TIMEOUT_SECONDS=300 \
            -v "${VOLUME}:/data" \
            "$IMAGE"
          echo "started $name"

      - name: Wait for readiness
        run: bash scripts/docker/wait-ready.sh http://127.0.0.1:8000 "pocketscore-c21-${RUN_ID}-main" 300

      # HARD DEPLOYMENT GATE: an unauthenticated staging API must be unreachable.
      # If the gate is off (or misconfigured) this step fails the build, so a
      # publicly reachable backend can never be produced by this pipeline.
      - name: Access gate enforced (anonymous must be blocked)
        run: bash scripts/deploy/verify-access-gate.sh http://127.0.0.1:8000 "$TEST_ACCESS_TOKEN"

      - name: Container runtime info
        run: |
          docker inspect "pocketscore-c21-${RUN_ID}-main" \
            --format '{"image":"{{.Config.Image}}","started":"{{.State.StartedAt}}","restarts":{{.RestartCount}}}' \
            > "$OUT_DIR/runtime-info.json"
          docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}}' \
            | tee "$OUT_DIR/container-stats.txt" || true

      # ------------------------------------------------------------------- AI
      - name: Real Basic Pitch transcription
        run: |
          python3 scripts/docker/verify-transcription.py \
            --base-url http://127.0.0.1:8000 \
            --audio tests/fixtures/melody.wav \
            --out "$OUT_DIR/transcription-result.json"

      - name: Reject an unsupported upload
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -F "file=@README.md;filename=evil.exe" http://127.0.0.1:8000/api/v1/audio/upload)
          echo "unsupported extension -> HTTP $code"
          test "$code" = "415"

      # --------------------------------------------------------- persistence
      - name: Stop the main container before the rebuild test
        run: |
          docker stop --time 30 "pocketscore-c21-${RUN_ID}-main" >/dev/null
          docker rm "pocketscore-c21-${RUN_ID}-main" >/dev/null

      - name: Persistence across a container rebuild
        run: bash scripts/docker/verify-persistence.sh "$IMAGE" "$VOLUME" "$RUN_ID" 8000

      # ------------------------------------------------------------- shutdown
      - name: Graceful shutdown on SIGTERM
        run: bash scripts/docker/verify-graceful-shutdown.sh "$IMAGE" "$VOLUME" "$RUN_ID" 8000

      # ------------------------------------------------------------- auditing
      - name: Dependency audit
        run: |
          set +e
          docker run --rm --entrypoint python "$IMAGE" -m pip check > "$OUT_DIR/pip-check.txt" 2>&1
          echo "pip check rc=$?"
          (cd frontend && npm audit --omit=dev --audit-level=critical > "../$OUT_DIR/npm-audit.txt" 2>&1)
          echo "npm audit rc=$?"
          cat "$OUT_DIR/pip-check.txt"
          tail -20 "$OUT_DIR/npm-audit.txt" || true
          exit 0

      - name: Write summary
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          {
            echo "# Docker verification (V1.1-C.2.1)"
            echo
            echo "- commit: \`${{ github.sha }}\`"
            echo "- run: ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            echo "- image: $IMAGE"
            echo
            for f in build-info.json image-info.txt ready-check.json transcription-result.json persistence-result.json graceful-shutdown.txt; do
              if [ -f "$OUT_DIR/$f" ]; then
                echo "## $f"
                echo '```'
                head -40 "$OUT_DIR/$f"
                echo '```'
              fi
            done
          } > "$OUT_DIR/summary.md"
          cat "$OUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-verification-${{ github.run_id }}
          path: docker-verification/
          retention-days: 14
          if-no-files-found: warn

      - name: Cleanup test resources
        if: always()
        run: bash scripts/docker/cleanup-test-resources.sh "$RUN_ID" "$VOLUME" || true

      - name: Container logs on failure
        if: failure()
        run: |
          for c in $(docker ps -aq --filter "name=pocketscore-c21-"); do
            echo "=== $c ==="
            docker logs "$c" 2>&1 | tail -100 || true
          done
