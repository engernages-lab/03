name: Docker verify (V1.1-C.2.1)

# Real Linux container gate: build the image, boot it with a Railway-style
# $PORT, run an actual Basic Pitch transcription, rebuild the container on the
# same volume and check the data survived, then verify SIGTERM shutdown.
#
# Manual dispatch is the primary entry point: the workflow is intentionally
# conservative about spending CI minutes on full AI image builds.

on:
  workflow_dispatch:
  pull_request:
    branches: [main, "pocketscore-v1.1-*"]
    paths:
      - "backend/**"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/vite.config.ts"
      - "tests/fixtures/**"
      - "scripts/docker/**"
      - "scripts/deploy/**"
      - ".github/workflows/docker-verify.yml"
      - "railway.json"
  push:
    branches: ["pocketscore-v1.1-b", main]
    paths:
      - "backend/**"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/vite.config.ts"
      - "tests/fixtures/**"
      - "scripts/docker/**"
      - "scripts/deploy/**"
      - ".github/workflows/docker-verify.yml"
      - "railway.json"

permissions:
  contents: read

concurrency:
  group: docker-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  OUT_DIR: docker-verification
  # aquasec/trivy:0.58.0 — digest resolved from the Docker Hub manifest list.
  TRIVY_IMAGE: aquasec/trivy@sha256:b88012e2a0a309d6a8a00463d4e63e5e513377fb74eccbc8f9b0f8f81940ebeb
  IMAGE: pocketscore-ai:c2-verify

jobs:
  docker-verify:
    name: docker-verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      # ---------------------------------------------------------------- shell
      - name: Syntax-check verification scripts
        run: |
          set -euo pipefail
          for script in scripts/docker/*.sh scripts/deploy/*.sh; do
            bash -n "$script"
            echo "syntax ok: $script"
          done
          python3 -m py_compile scripts/docker/verify-transcription.py scripts/docker/verify-context.py
          echo "syntax ok: python tools"

      # --------------------------------------------------------------- secrets
      - name: Generate throwaway test secrets
        run: |
          set -euo pipefail
          SESSION=$(openssl rand -base64 48 | tr -d '\n')
          GATE=$(openssl rand -hex 24)
          FERNET=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '\n')
          echo "::add-mask::$SESSION"
          echo "::add-mask::$GATE"
          echo "::add-mask::$FERNET"
          echo "TEST_SESSION_SECRET=$SESSION" >> "$GITHUB_ENV"
          echo "TEST_ACCESS_TOKEN=$GATE" >> "$GITHUB_ENV"
          echo "TEST_TOKEN_KEY=$FERNET" >> "$GITHUB_ENV"
          echo "RUN_ID=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "VOLUME=pocketscore-c21-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Secret scan (pre-build)
        run: bash scripts/docker/scan-secrets.sh

      # --------------------------------------------------------------- frontend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (lockfile)
        working-directory: frontend
        run: npm ci

      - name: Production build
        working-directory: frontend
        env:
          VITE_BASE_PATH: /03/
        run: npm run build

      # The image builds its own SPA in a node stage, so this is an independent
      # check of the Pages build (base /03/) rather than an input to docker build.
      - name: Verify frontend artefacts (Pages base path)
        run: |
          set -euo pipefail
          test -f frontend/dist/index.html
          test -d frontend/dist/assets
          map_count=$(find frontend/dist -name '*.map' | wc -l)
          echo "sourcemaps in dist: $map_count"
          test "$map_count" -eq 0
          du -sh frontend/dist

      # A missing COPY source (or one hidden by .dockerignore) otherwise fails
      # deep inside BuildKit with a log that needs repo admin rights to read.
      - name: Verify build context (Dockerfile COPY vs .dockerignore)
        run: python3 scripts/docker/verify-context.py --dockerfile backend/Dockerfile

      # ----------------------------------------------------------------- docker
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.10.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.18.0
        with:
          context: .
          file: backend/Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=pocketscore-docker
          cache-to: type=gha,mode=max,scope=pocketscore-docker
          build-args: |
            BUILD_REVISION=${{ github.sha }}

      - name: Verify image contents (deps, model, ffmpeg, dist)
        run: bash scripts/docker/verify-image.sh "$IMAGE"

      - name: Image security scan
        run: bash scripts/docker/scan-secrets.sh "$IMAGE"

      # The container must not run as root: this boots the real final stage on an
      # isolated volume and checks the uid, data writes, WAL, SIGTERM and restart
      # persistence. It creates and removes only its own volume.
      - name: Non-root runtime and isolated volume
        run: bash scripts/docker/test_nonroot_runtime.sh "$IMAGE"

      - name: Historical volume A - already owned by 10001
        run: bash scripts/docker/test_nonroot_volume.sh mode-a "$IMAGE"

      - name: Historical volume B - root-owned legacy volume (read/write boundary)
        run: bash scripts/docker/test_nonroot_volume.sh mode-b "$IMAGE"

      - name: Historical volume C - scope-limited one-off migration
        run: bash scripts/docker/test_nonroot_volume.sh mode-c "$IMAGE"

      # The ops tooling ships inside the image (app/ops), but the tests are not
      # baked in (.dockerignore drops tests/). Mount them read-only and run the
      # suites with the image's own interpreter, so the SQLite version and the
      # module layout are exactly what production would use. Everything here is
      # synthetic: no Railway access, no real audio, no secrets.
      - name: Ops tests inside the image (backup, joint restore, storage audit)
        run: |
          set -uo pipefail
          docker run --rm \
            -v "$PWD/backend/tests:/tests:ro" \
            -v "$PWD/tests/fixtures:/fixtures:ro" \
            -v "$PWD:/repo:ro" \
            -w /app \
            -e HOME=/app/tmp \
            -e NUMBA_CACHE_DIR=/app/tmp/numba \
            -e MPLCONFIGDIR=/app/tmp/mpl \
            -e POCKETSCORE_ENVIRONMENT=test \
            -e POCKETSCORE_ACCESS_GATE_MODE=off \
            -e POCKETSCORE_MODEL_PRELOAD=false \
            -e POCKETSCORE_REPO_ROOT=/repo \
            --entrypoint python \
            "$IMAGE" -m pytest -q -p no:cacheprovider --basetemp=/app/tmp/pytest \
              /tests/test_database_backup.py \
              /tests/test_storage_audit.py \
              /tests/test_project_backup.py \
              /tests/test_project_restore_e2e.py

      - name: Security tests inside the image (paths, rate limit, CORS, headers)
        run: |
          set -uo pipefail
          docker run --rm \
            -v "$PWD/backend/tests:/tests:ro" \
            -v "$PWD/tests/fixtures:/fixtures:ro" \
            -v "$PWD:/repo:ro" \
            -w /app \
            -e HOME=/app/tmp \
            -e NUMBA_CACHE_DIR=/app/tmp/numba \
            -e MPLCONFIGDIR=/app/tmp/mpl \
            -e POCKETSCORE_ENVIRONMENT=test \
            -e POCKETSCORE_ACCESS_GATE_MODE=off \
            -e POCKETSCORE_MODEL_PRELOAD=false \
            -e POCKETSCORE_REPO_ROOT=/repo \
            --entrypoint python \
            "$IMAGE" -m pytest -q -p no:cacheprovider --basetemp=/app/tmp/pytest \
              /tests/test_storage_path_safety.py \
              /tests/test_upload_filename_safety.py \
              /tests/test_storage_api_security.py \
              /tests/test_rate_limit.py \
              /tests/test_cors_security.py \
              /tests/test_security_headers.py \
              /tests/test_runtime_config.py

      # --------------------------------------------------------------- run: PORT
      - name: Create test volume
        run: docker volume create "$VOLUME"

      - name: PORT injection - non-default port 8123
        run: |
          set -euo pipefail
          name="pocketscore-c21-${RUN_ID}-port"
          docker run -d --name "$name" -p 127.0.0.1:8123:8123 \
            -e PORT=8123 \
            -e POCKETSCORE_ENVIRONMENT=staging \
            -e POCKETSCORE_LOG_JSON=true \
            -e "POCKETSCORE_SESSION_SECRET=${TEST_SESSION_SECRET}" \
            -e "POCKETSCORE_TOKEN_ENCRYPTION_KEY=${TEST_TOKEN_KEY}" \
            -e POCKETSCORE_CORS_ORIGINS=http://127.0.0.1:8123 \
            -e POCKETSCORE_ALLOW_PRIVATE_NETWORK_SOURCES=false \
            -e "POCKETSCORE_ACCESS_GATE_TOKEN=${TEST_ACCESS_TOKEN}" \
            -e POCKETSCORE_DATABASE_URL=sqlite:////data/pocketscore.db \
            -e POCKETSCORE_STORAGE_DIR=/data/storage \
            -e POCKETSCORE_MODEL_PRELOAD=true \
            -v "${VOLUME}:/data" \
            "$IMAGE"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8123/health >/dev/null; then
              echo "PORT=8123 honoured after ${i} polls"
              docker port "$name"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8123/health > /dev/null || (docker logs "$name"; exit 1)
          # the container must NOT be listening on 8000
          if docker exec "$name" sh -c 'python -c "import socket,sys; s=socket.socket(); sys.exit(0 if s.connect_ex((\"127.0.0.1\",8000))==0 else 1)"'; then
            echo "::error::service also listening on 8000 - PORT was ignored"
            exit 1
          fi
          docker stop --time 30 "$name" >/dev/null
          docker rm "$name" >/dev/null

      - name: Start container on the default port with the volume
        run: |
          set -euo pipefail
          name="pocketscore-c21-${RUN_ID}-main"
          docker run -d --name "$name" -p 127.0.0.1:8000:8000 \
            -e PORT=8000 \
            -e POCKETSCORE_ENVIRONMENT=staging \
            -e POCKETSCORE_DEBUG=false \
            -e POCKETSCORE_LOG_JSON=true \
            -e "POCKETSCORE_SESSION_SECRET=${TEST_SESSION_SECRET}" \
            -e "POCKETSCORE_TOKEN_ENCRYPTION_KEY=${TEST_TOKEN_KEY}" \
            -e POCKETSCORE_CORS_ORIGINS=http://127.0.0.1:8000 \
            -e POCKETSCORE_ALLOW_PRIVATE_NETWORK_SOURCES=false \
            -e "POCKETSCORE_ACCESS_GATE_TOKEN=${TEST_ACCESS_TOKEN}" \
            -e POCKETSCORE_DATABASE_URL=sqlite:////data/pocketscore.db \
            -e POCKETSCORE_STORAGE_DIR=/data/storage \
            -e POCKETSCORE_MODEL_PRELOAD=true \
            -e POCKETSCORE_MAX_UPLOAD_MB=50 \
            -e POCKETSCORE_MAX_CONCURRENT_INFERENCES=1 \
            -e POCKETSCORE_INFERENCE_TIMEOUT_SECONDS=300 \
            -e POCKETSCORE_RATE_LIMIT_REQUESTS=2000 \
            -e POCKETSCORE_UPLOAD_RATE_LIMIT_REQUESTS=100 \
            -e POCKETSCORE_TRANSCRIPTION_RATE_LIMIT_REQUESTS=100 \
            -e POCKETSCORE_WAVEFORM_RATE_LIMIT_REQUESTS=500 \
            -v "${VOLUME}:/data" \
            "$IMAGE"
          echo "started $name"

      - name: Wait for readiness
        run: bash scripts/docker/wait-ready.sh http://127.0.0.1:8000 "pocketscore-c21-${RUN_ID}-main" 300

      # HARD DEPLOYMENT GATE: an unauthenticated staging API must be unreachable.
      # If the gate is off (or misconfigured) this step fails the build, so a
      # publicly reachable backend can never be produced by this pipeline.
      - name: Access gate enforced (anonymous must be blocked)
        run: bash scripts/deploy/verify-access-gate.sh http://127.0.0.1:8000 "$TEST_ACCESS_TOKEN"

      # The SPA and its assets are behind the same gate, so "the file exists in
      # the image" is not proof that a browser can load it. These probes exercise
      # the real HTTP path: authenticated 200s, anonymous 401s, correct MIME and a
      # root-relative base path. Asset names are taken from the served HTML, never
      # hard-coded, because Vite hashes them per build.
      - name: SPA and static assets over HTTP
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:8000
          AUTH="Authorization: Bearer $TEST_ACCESS_TOKEN"
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT

          echo "== authenticated homepage =="
          code=$(curl -s -D "$tmp/home.headers" -o "$tmp/home.html" -w '%{http_code}' -H "$AUTH" "$BASE/")
          test "$code" = "200" || { echo "::error::GET / returned $code"; cat "$tmp/home.headers"; exit 1; }
          grep -qi 'content-type: *text/html' "$tmp/home.headers" \
            || { echo "::error::/ is not text/html"; grep -i '^content-type' "$tmp/home.headers"; exit 1; }
          test -s "$tmp/home.html" || { echo "::error::/ returned an empty body"; exit 1; }
          grep -qi '<html' "$tmp/home.html" || { echo "::error::/ is not an HTML document"; exit 1; }
          if grep -q 'ACCESS_GATE_REQUIRED' "$tmp/home.html"; then
            echo "::error::/ returned the gate error envelope instead of the app"
            exit 1
          fi
          echo "homepage ok: $(wc -c < "$tmp/home.html") bytes, text/html"

          echo "== anonymous homepage must be refused =="
          anon=$(curl -s -o "$tmp/anon-home.json" -w '%{http_code}' "$BASE/")
          test "$anon" = "401" || { echo "::error::anonymous GET / returned $anon"; exit 1; }
          echo "homepage anonymous: $anon"

          echo "== base path assertions =="
          grep -q '/assets/' "$tmp/home.html" || { echo "::error::index.html does not reference /assets/"; exit 1; }
          if grep -q '/03/' "$tmp/home.html"; then
            echo "::error::index.html still uses the /03/ base path (Pages build leaked into the image)"
            exit 1
          fi
          echo "base path ok: root-relative /assets/, no /03/"

          echo "== assets referenced by the page =="
          mapfile -t JS_ASSETS < <(grep -oE '/assets/[^"]+\.js' "$tmp/home.html" | sort -u)
          mapfile -t CSS_ASSETS < <(grep -oE '/assets/[^"]+\.css' "$tmp/home.html" | sort -u)
          test "${#JS_ASSETS[@]}" -ge 1 || { echo "::error::index.html references no JS asset"; exit 1; }
          test "${#CSS_ASSETS[@]}" -ge 1 || { echo "::error::index.html references no CSS asset"; exit 1; }

          for asset in "${JS_ASSETS[@]}" "${CSS_ASSETS[@]}"; do
            case "$asset" in
              *.js) want='javascript' ;;
              *.css) want='css' ;;
              *) echo "::error::unexpected asset $asset"; exit 1 ;;
            esac
            acode=$(curl -s -D "$tmp/a.headers" -o "$tmp/a.body" -w '%{http_code}' -H "$AUTH" "$BASE$asset")
            test "$acode" = "200" || { echo "::error::$asset returned $acode"; exit 1; }
            test -s "$tmp/a.body" || { echo "::error::$asset returned an empty body"; exit 1; }
            ctype=$(grep -i '^content-type:' "$tmp/a.headers" | tr -d '\r' | cut -d' ' -f2)
            echo "$ctype" | grep -qi "$want" || { echo "::error::$asset content-type '$ctype' is not $want"; exit 1; }
            if head -c 64 "$tmp/a.body" | grep -qi '<!doctype html'; then
              echo "::error::$asset served an HTML page instead of the asset"
              exit 1
            fi
            anon_code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE$asset")
            test "$anon_code" = "401" || { echo "::error::$asset anonymous returned $anon_code"; exit 1; }
            echo "asset ok: $asset ($acode, $(wc -c < "$tmp/a.body") bytes, $ctype, anonymous $anon_code)"
          done

      - name: Container runtime info
        run: |
          docker inspect "pocketscore-c21-${RUN_ID}-main" \
            --format '{"image":"{{.Config.Image}}","started":"{{.State.StartedAt}}","restarts":{{.RestartCount}}}' \
            > "$OUT_DIR/runtime-info.json"
          docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}}' \
            | tee "$OUT_DIR/container-stats.txt" || true

      # ------------------------------------------------------------------- AI
      - name: Real Basic Pitch transcription
        run: |
          python3 scripts/docker/verify-transcription.py \
            --base-url http://127.0.0.1:8000 \
            --token "$TEST_ACCESS_TOKEN" \
            --audio tests/fixtures/melody.wav \
            --out "$OUT_DIR/transcription-result.json"

      # Logs need credentials here, but artifact names are public: the probe
      # results are encoded into the artifact name so a fast-failing step can be
      # diagnosed without guessing. This never replaces the real check.
      - name: Transcription diagnostics (public signal)
        if: failure()
        run: |
          set -uo pipefail
          python3 scripts/docker/diagnose-transcription.py "${TEST_ACCESS_TOKEN}" \
            | tee /tmp/diag.txt || true
          codes=$(head -1 /tmp/diag.txt | tr ' ' '-')
          echo "DIAG=${codes:-no-probe}" >> "$GITHUB_ENV"
          echo "::error title=transcription-diagnostics::${codes:-no-probe}"

      - name: Upload transcription diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: diag-${{ env.DIAG }}
          path: /tmp/diag.txt
          retention-days: 5
          if-no-files-found: warn

      - name: Reject an unsupported upload

        run: |
          set -euo pipefail
          # the endpoint is behind the access gate: authenticate first, then the
          # 415 must come from media validation rather than from the gate
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TEST_ACCESS_TOKEN" \
            -F "file=@README.md;filename=evil.exe" http://127.0.0.1:8000/api/v1/audio/upload)
          echo "unsupported extension -> HTTP $code"
          test "$code" = "415"

      # The size limit must be enforced over the wire, not just in unit tests.
      # The limit is read from the running container instead of assuming 50 MB,
      # the oversized file contains real bytes (10% over the limit so the
      # Content-Length pre-check fires), and a file inside the limit is uploaded
      # afterwards to prove the endpoint itself still works.
      - name: Upload size limit returns 413
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:8000
          AUTH="Authorization: Bearer $TEST_ACCESS_TOKEN"
          NAME="pocketscore-c21-${RUN_ID}-main"

          limit_mb=$(docker exec "$NAME" printenv POCKETSCORE_MAX_UPLOAD_MB || true)
          limit_mb=${limit_mb:-100}
          echo "container upload limit: ${limit_mb}MB"

          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT

          size_mb=$(( limit_mb + limit_mb / 10 + 1 ))
          { printf 'RIFF'; head -c $(( size_mb * 1024 * 1024 )) /dev/zero; } > "$tmp/oversize.wav"
          echo "oversize test file: ${size_mb}MB ($(wc -c < "$tmp/oversize.wav") bytes)"

          # curl may report a send error when the server rejects on Content-Length
          # and closes the connection; the assertion below is on the HTTP status,
          # so the exit code is captured instead of being masked.
          code=$(curl -s -o "$tmp/oversize.json" -w '%{http_code}' --max-time 180 \
            -H "$AUTH" -F "file=@$tmp/oversize.wav;filename=oversize.wav" \
            "$BASE/api/v1/audio/upload") || echo "curl exit=$?"
          echo "oversize upload -> HTTP $code"
          head -c 300 "$tmp/oversize.json" || true
          echo
          test "$code" = "413" || { echo "::error::expected 413, got '$code'"; exit 1; }
          grep -q 'PAYLOAD_TOO_LARGE' "$tmp/oversize.json" \
            || { echo "::error::413 without the PAYLOAD_TOO_LARGE envelope"; exit 1; }

          small=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "$AUTH" -F "file=@tests/fixtures/melody.wav;filename=melody.wav" \
            "$BASE/api/v1/audio/upload")
          echo "in-limit upload -> HTTP $small (expected 201)"
          test "$small" = "201" || { echo "::error::in-limit upload returned $small"; exit 1; }

      # --------------------------------------------------------- persistence
      - name: Stop the main container before the rebuild test
        run: |
          docker stop --time 30 "pocketscore-c21-${RUN_ID}-main" >/dev/null
          docker rm "pocketscore-c21-${RUN_ID}-main" >/dev/null

      - name: Persistence across a container rebuild
        run: bash scripts/docker/verify-persistence.sh "$IMAGE" "$VOLUME" "$RUN_ID" 8000

      # ------------------------------------------------------------- shutdown
      - name: Graceful shutdown on SIGTERM
        run: bash scripts/docker/verify-graceful-shutdown.sh "$IMAGE" "$VOLUME" "$RUN_ID" 8000

      # ------------------------------------------------------------- auditing
      - name: Dependency audit
        run: |
          set +e
          docker run --rm --entrypoint python "$IMAGE" -m pip check > "$OUT_DIR/pip-check.txt" 2>&1
          echo "pip check rc=$?"
          (cd frontend && npm audit --omit=dev --audit-level=critical > "../$OUT_DIR/npm-audit.txt" 2>&1)
          echo "npm audit rc=$?"
          cat "$OUT_DIR/pip-check.txt"
          tail -20 "$OUT_DIR/npm-audit.txt" || true
          exit 0

      # ------------------------------------------------------- supply chain
      # Scanners are report-only in this phase: findings are archived as artefacts
      # and triaged in the report. A scanner *crash* is recorded as unavailable,
      # never as "clean" -- the status file makes the difference explicit.
      - name: Python dependency audit (pip-audit)
        run: |
          set -uo pipefail
          python3 -m venv "$RUNNER_TEMP/audit-venv"
          "$RUNNER_TEMP/audit-venv/bin/pip" install --quiet --upgrade pip pip-audit
          status=0
          "$RUNNER_TEMP/audit-venv/bin/pip-audit" \
              --requirement backend/requirements.txt \
              --format json --output "$OUT_DIR/python-audit.json" || status=$?
          announce_status=$status
          "$RUNNER_TEMP/audit-venv/bin/pip-audit" \
              --requirement backend/requirements.txt \
              --format columns > "$OUT_DIR/python-audit-report.txt" 2>&1 || status=$?
          if [ "$announce_status" -eq 0 ]; then
            echo "result=clean" > "$OUT_DIR/python-audit-status.txt"
          elif [ "$announce_status" -eq 1 ]; then
            echo "result=findings" > "$OUT_DIR/python-audit-status.txt"
          else
            echo "result=unavailable exit=$announce_status" > "$OUT_DIR/python-audit-status.txt"
          fi
          cat "$OUT_DIR/python-audit-status.txt"
          cat "$OUT_DIR/python-audit-report.txt" || true

      - name: Node dependency audit (npm audit)
        run: |
          set -uo pipefail
          cd frontend
          npm audit --json > "../$OUT_DIR/npm-audit.json" 2>/dev/null || true
          npm audit --omit=dev --json > "../$OUT_DIR/npm-production-audit.json" 2>/dev/null || true
          npm audit --omit=dev --audit-level=high > "../$OUT_DIR/npm-audit-report.txt" 2>&1 || true
          python3 -c "import json,os; p='../$OUT_DIR/npm-production-audit.json'; d=json.load(open(p,encoding='utf-8')) if (os.path.exists(p) and os.path.getsize(p)>2) else {}; m=(d.get('metadata') or {}).get('vulnerabilities') or {}; t=sum(v for k,v in m.items() if k!='total'); print('result=' + ('clean' if t==0 else 'findings ' + json.dumps(m)))" > "../$OUT_DIR/npm-audit-status.txt" 2>&1 || echo "result=unavailable" > "../$OUT_DIR/npm-audit-status.txt"
          cat "../$OUT_DIR/npm-audit-status.txt"
          head -40 "../$OUT_DIR/npm-audit-report.txt" || true

      - name: Image vulnerability scan and SBOM (Trivy)
        run: |
          set -uo pipefail
          status=0
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/$OUT_DIR:/out" "$TRIVY_IMAGE" \
            image --quiet --scanners vuln --format json --output /out/docker-scan.json "$IMAGE" \
            || status=$?
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/$OUT_DIR:/out" "$TRIVY_IMAGE" \
            image --quiet --scanners vuln --format table --output /out/docker-scan-report.txt "$IMAGE" \
            || status=$?
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/$OUT_DIR:/out" "$TRIVY_IMAGE" \
            image --quiet --format cyclonedx --output /out/pocketscore-sbom.cdx.json "$IMAGE" \
            || status=$?
          if [ "$status" -ne 0 ]; then
            echo "result=unavailable exit=$status" > "$OUT_DIR/docker-scan-status.txt"
          else
            echo "result=ok" > "$OUT_DIR/docker-scan-status.txt"
          fi
          cat "$OUT_DIR/docker-scan-status.txt"
          python3 -c "import json,os,collections; p='$OUT_DIR/docker-scan.json'; d=json.load(open(p,encoding='utf-8')) if (os.path.exists(p) and os.path.getsize(p)>2) else {}; c=collections.Counter(v.get('Severity','UNKNOWN') for r in (d.get('Results') or []) for v in (r.get('Vulnerabilities') or [])); print('image vulnerabilities by severity:', dict(c) or 'none reported')" || true
          ls -la "$OUT_DIR" | tail -15

      - name: Write summary
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          {
            echo "# Docker verification (V1.1-C.2.1)"
            echo
            echo "- commit: \`${{ github.sha }}\`"
            echo "- run: ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            echo "- image: $IMAGE"
            echo
            for f in build-info.json image-info.txt ready-check.json transcription-result.json persistence-result.json graceful-shutdown.txt; do
              if [ -f "$OUT_DIR/$f" ]; then
                echo "## $f"
                echo '```'
                head -40 "$OUT_DIR/$f"
                echo '```'
              fi
            done
          } > "$OUT_DIR/summary.md"
          cat "$OUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification artefacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: docker-verification-${{ github.run_id }}
          path: docker-verification/
          retention-days: 14
          if-no-files-found: warn

      - name: Cleanup test resources
        if: always()
        run: bash scripts/docker/cleanup-test-resources.sh "$RUN_ID" "$VOLUME" || true

      - name: Container logs on failure
        if: failure()
        run: |
          for c in $(docker ps -aq --filter "name=pocketscore-c21-"); do
            echo "=== $c ==="
            docker logs "$c" 2>&1 | tail -100 || true
          done
