[pytest]
testpaths = tests
pythonpath = .
# Keep temporary artefacts inside the repo but ignored (see .gitignore) so tests
# never write into the user's temp root or the project source tree.
addopts = -q --strict-markers --basetemp=.pytest-tmp
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    integration: tests that exercise several modules together
    provider: tests that talk to a real third-party platform (skipped by default)
    slow: runs the transcription model over the whole benchmark corpus
